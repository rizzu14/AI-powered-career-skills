services:
  - type: web
    name: skillpilot-ai
    runtime: python
    buildCommand: pip install -e . && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=10000 --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
